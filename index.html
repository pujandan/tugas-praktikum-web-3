<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA UT: Pemesanan Bahan Ajar</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="halaman-dalam">
  <div id="app">
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand">SITTA UT</a>
        <nav class="menu-nav">
          <button v-for="t in daftarTab" :key="t.id" :class="{ aktif: tab === t.id }" @click="tab = t.id">
            {{ t.label }}
          </button>
        </nav>
      </div>
    </header>

    <main class="container">
      <ba-stock-table v-if="tab === 'stok'" :data-ut="dataUt"></ba-stock-table>
      <do-tracking v-else-if="tab === 'tracking'" :data-ut="dataUt" @tambah-do="tambahDo"></do-tracking>
      <order-form v-else :data-ut="dataUt" @tambah-do="tambahDo"></order-form>
    </main>

    <footer class="footer">
      <p>SITTA UT: Tugas Praktik 3, Pemrograman Berbasis Web</p>
      <p>Pujan Daniar / 053074671</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/components/status-badge.js"></script>
  <script src="js/components/app-modal.js"></script>
  <script src="js/components/stock-table.js"></script>
  <script src="js/components/order-form.js"></script>
  <script src="js/components/do-tracking.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
